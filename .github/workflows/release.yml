name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to build (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: build · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, name: aarch64-macos, target: aarch64-apple-darwin }
          - { os: macos-15-intel, name: x86_64-macos, target: x86_64-apple-darwin }
          - { os: ubuntu-latest, name: x86_64-linux, target: x86_64-unknown-linux-musl, deb_arch: amd64, rpm_arch: x86_64 }
          - { os: ubuntu-24.04-arm, name: aarch64-linux, target: aarch64-unknown-linux-musl, deb_arch: arm64, rpm_arch: aarch64 }
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install packaging tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools dpkg-dev rpm

      - name: Build panini
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          v="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$v" >> "$GITHUB_OUTPUT"
          echo "num=${v#v}" >> "$GITHUB_OUTPUT"

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          stage="panini-${{ steps.ver.outputs.tag }}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/panini" "$stage/"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          tar -czf "dist/${stage}.tar.gz" "$stage"

      # Debian package, from the committed template in dist/debian/<arch>.
      - name: Build .deb (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.num }}"
          root="dist/debian/${{ matrix.deb_arch }}"
          mkdir -p "$root/usr/local/bin"
          install -m 0755 "target/${{ matrix.target }}/release/panini" "$root/usr/local/bin/panini"
          sed -i "s/^Version: .*/Version: ${ver}/" "$root/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$root" "dist/panini_${ver}_${{ matrix.deb_arch }}.deb"

      # RPM package, from the committed spec in dist/rpm/<arch>.
      - name: Build .rpm (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          ver="${{ steps.ver.outputs.num }}"
          arch="${{ matrix.rpm_arch }}"
          src="dist/rpm/${arch}"
          mkdir -p "$src/usr/local/bin"
          install -m 0755 "target/${{ matrix.target }}/release/panini" "$src/usr/local/bin/panini"
          sed -i "s/^Version:        .*/Version:        ${ver}/" "$src/panini.spec"
          top="$(pwd)/rpmbuild"
          mkdir -p "$top"/{BUILD,RPMS,SOURCES,SPECS,BUILDROOT}
          cp -r "$src" "$top/SOURCES/${arch}"
          rpmbuild --define "_topdir ${top}" --define "_sourcedir ${top}/SOURCES" \
                   --target "${arch}" -bb "$src/panini.spec"
          find "$top/RPMS" -name '*.rpm' -exec cp {} dist/ \;

      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          sha() { command -v sha256sum >/dev/null && sha256sum "$1" || shasum -a 256 "$1"; }
          shopt -s nullglob
          for f in *.tar.gz *.deb *.rpm; do sha "$f" > "$f.sha256"; done
          ls -lh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: |
            dist/*.tar.gz*
            dist/*.deb*
            dist/*.rpm*
          if-no-files-found: error

  # BSD targets are host-only: build the panini CLI (pure Rust) inside a
  # FreeBSD/NetBSD/OpenBSD x86_64 VM. These run under emulation and can be
  # flaky, so they must never block the main release (see the release job's
  # `if:` — it publishes as long as the macOS/Linux build succeeded).
  build-bsd:
    name: build · ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: freebsd, version: "15.1", name: x86_64-freebsd }
          - { os: netbsd,  version: "10.1", name: x86_64-netbsd }
          - { os: openbsd, version: "7.9",  name: x86_64-openbsd }
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: ver
        shell: bash
        run: echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - name: Start ${{ matrix.os }} ${{ matrix.version }} VM (x86_64)
        uses: cross-platform-actions/action@v1.3.0
        with:
          operating_system: ${{ matrix.os }}
          version: ${{ matrix.version }}
          architecture: x86-64
          shell: bash
          memory: 8G
          cpu_count: 4

      - name: Build panini in VM
        shell: cpa.sh {0}
        run: |
          set -euo pipefail
          export PATH="/usr/local/bin:/usr/pkg/bin:$HOME/.cargo/bin:$PATH"
          # OpenBSD's default datasize ulimit is too low for rustc.
          ulimit -d "$(ulimit -H -d)" 2>/dev/null || true

          # Only Rust is needed to build the CLI. BSD package managers can exit
          # nonzero even on success, so tolerate it and verify cargo below.
          set +e
          case "${{ matrix.os }}" in
            freebsd) sudo env ASSUME_ALWAYS_YES=YES pkg install -y rust ;;
            netbsd)
              echo "http://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/amd64/${{ matrix.version }}/All" \
                | sudo tee /usr/pkg/etc/pkgin/repositories.conf >/dev/null
              sudo pkgin -y update && sudo pkgin -y install rust
              ;;
            openbsd) sudo pkg_add -I rust ;;
          esac
          set -e
          command -v cargo >/dev/null || { echo "cargo not found after install"; exit 1; }
          cargo --version

          # Keep target/ out of the synced workspace; stage only the binary back.
          export CARGO_TARGET_DIR="$HOME/build"
          cargo build --release --locked
          mkdir -p artifacts
          cp "$CARGO_TARGET_DIR/release/panini" artifacts/panini

      - name: Package tarball
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          stage="panini-${{ steps.ver.outputs.tag }}-${{ matrix.name }}"
          mkdir -p "$stage"
          install -m 0755 artifacts/panini "$stage/panini"
          cp README.md LICENSE "$stage/" 2>/dev/null || true
          tar -czf "dist/${stage}.tar.gz" "$stage"
          (cd dist && sha256sum "${stage}.tar.gz" > "${stage}.tar.gz.sha256")
          ls -lh dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: dist/*.tar.gz*
          if-no-files-found: error

  release:
    name: Publish release + Gemfury
    needs: [build, build-bsd]
    # Publish as long as the macOS/Linux build succeeded; BSD is a best-effort
    # add-on and must not block the release if its VMs fail.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Check Gemfury secrets
        id: gemfury
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        run: |
          if [ -n "$FURY_TOKEN" ] && [ -n "$FURY_ACCOUNT" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Gemfury secrets not set; skipping push"
          fi

      - name: Push .deb and .rpm to Gemfury
        if: steps.gemfury.outputs.available == 'true'
        env:
          FURY_TOKEN: ${{ secrets.FURY_TOKEN }}
          FURY_ACCOUNT: ${{ secrets.FURY_ACCOUNT }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          for pkg in dist/*.deb dist/*.rpm; do
            echo "Pushing $pkg to Gemfury (${FURY_ACCOUNT})"
            curl -fsS -F package=@"${pkg}" "https://${FURY_TOKEN}@push.fury.io/${FURY_ACCOUNT}/"
            echo
          done
